{% extends "base.html" %}

{% block title %}Admin Login - SMS{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="card glass auth-card">
        <div class="welcome-section" style="text-align: center; margin-bottom: 2rem;">
            <h1>Admin <span class="text-gradient">Access</span></h1>
            <p class="text-muted">Enter administrative credentials to manage the portal.</p>
        </div>
        <form action="{{ url_for('auth.admin_login') }}" method="POST">
            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="admin" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem; background: #1e293b;">
                <i class="fas fa-user-shield"></i> Admin Login
            </button>
        </form>
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
            <p class="text-muted"><a href="/" class="text-primary">&larr; Back to Home</a></p>
        </div>
    </div>
</div>
{% endblock %}
